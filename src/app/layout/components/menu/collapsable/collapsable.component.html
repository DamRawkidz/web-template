<div class="se_item_warpper" >
  <div (click)="toggleCollapsable()" [ngClass]=" item?.ischildActive  ? 'child_active' : '' ">
    <a class="se_item hover:cursor-pointer">
      {{ item?.title }}
      <mat-icon class="se_icon"  [ngStyle]="{'transform': isCollapsed ? '': 'rotate(360deg)'}">expand_more</mat-icon>
    </a>
  </div>

  @if (!isCollapsed) {
    <div class="se_item_children" @expandCollapse>
      @for (menuChilden of item.children; track identify($index, menuChilden)) {
        @if (menuChilden.type == 'basic') {
          <app-basic-menu [item]="menuChilden"></app-basic-menu>
        }
        @if (menuChilden.type == 'collapsable') {
          <app-collapsable [item]="menuChilden"></app-collapsable>
        }
      }
    </div>
  }

</div>
