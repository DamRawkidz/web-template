<header class="app-toolbar-shell">
  <div id="toolbar" class="app-toolbar">
    <div class="toolbar-left">
      <button (click)="toggleMenu()" mat-icon-button class="toolbar-icon-btn" aria-label="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
    <div class="toolbar-right">
      <button (click)="logout()" mat-icon-button class="toolbar-icon-btn" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</header>
